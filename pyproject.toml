[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ht2sim"
version = "0.1.0"
description = "A toolkit for simulating and analysing Hitag2 protocol exchanges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ht2sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
